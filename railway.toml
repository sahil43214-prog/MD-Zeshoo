[build]
builder = "NIXPACKS"
buildCommand = "unset NPM_CONFIG_PRODUCTION npm_config_production; npm install --omit=dev --no-audit --no-fund --prefer-offline"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
